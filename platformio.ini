; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    etlcpp/Embedded Template Library@20.39.4




[env:motor_test]
build_src_filter= -<*> +<motor_test_main.cpp>

[env:mac_address]
build_src_filter = -<*> +<mac_address_main.cpp>

[env:led_test]
build_src_filter = -<*> +<led_test_main.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

; Web page (docs/color.html) sets the onboard RGB LED color through EMQX.
; Not a web server on the ESP: both sides talk through the MQTT broker.
[env:webserver_test]
build_src_filter = -<*> +<webserver_test_main.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
