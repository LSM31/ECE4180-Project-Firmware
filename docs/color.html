<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Rig: LED Color Test</title>
  <style>
    :root { --bg:#f6f4f1; --card:#fff; --text:#1f1b16; --muted:#6b645b; --accent:#7a4a24; --ok:#2e7d32; --bad:#c62828; --border:#e3ddd5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16130f; --card:#211d18; --text:#f1ece5; --muted:#a39a8f; --accent:#d39a62; --ok:#66bb6a; --bad:#ef5350; --border:#3a332b; }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; }
    h1 { font-size:1.25rem; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
    .bulb { width:96px; height:96px; border-radius:50%; margin:0 auto 12px; background:#555; transition:background .2s, box-shadow .2s; }
    .bulb.unknown { background:repeating-linear-gradient(45deg,#777 0 6px,#666 6px 12px); }
    input[type=color] { width:100%; height:56px; border:1px solid var(--border); border-radius:12px; background:none; padding:4px; cursor:pointer; margin-bottom:12px; }
    input:disabled, button:disabled { opacity:.45; cursor:not-allowed; }
    .swatches { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:12px; }
    .swatches button { aspect-ratio:1; border-radius:50%; border:1px solid var(--border); cursor:pointer; padding:0; }
    .off { width:100%; font:inherit; font-weight:600; padding:12px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; }
    .status { display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-top:16px; gap:8px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:middle; }
    .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Coffee Rig</h1>
    <p class="sub">Onboard LED color test</p>

    <div id="bulb" class="bulb unknown" aria-hidden="true"></div>
    <p id="ledText" class="sub">LED color unknown</p>

    <input id="picker" type="color" value="#ff8800" aria-label="LED color" disabled>
    <div class="swatches" id="swatches"></div>
    <button id="off" class="off" disabled>Turn off</button>

    <div class="status">
      <span><span id="brokerDot" class="dot"></span><span id="brokerText">Connecting to broker…</span></span>
      <span><span id="espDot" class="dot"></span><span id="espText">ESP unknown</span></span>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="color.js"></script>
</body>
</html>
